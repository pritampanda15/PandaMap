[package]
name = "pandamap-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust spatial-hash + parallel MD/docking interaction engine for PandaMap"
license = "MIT"

[lib]
name = "pandamap_engine"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pandamap-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
